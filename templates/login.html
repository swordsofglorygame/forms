{% extends "base.html" %}
{% block title %}دخول الإدارة{% endblock %}
{% block content %}
<section class="narrow-page">
  <div class="page-title"><span class="eyebrow">STAFF ACCESS</span><h1>دخول الإدارة</h1><p>هذه الصفحة مخصصة لفريق إدارة النماذج.</p></div>
  <form method="post" class="panel form-layout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" required maxlength="80" autofocus>
    <label for="password">كلمة المرور</label><input id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="button button-primary button-wide" type="submit">تسجيل الدخول</button>
  </form>
</section>
{% endblock %}
