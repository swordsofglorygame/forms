# نشر اختياري على Render باستخدام Web Service + PostgreSQL.
# عند إنشاء Blueprint، أدخل ADMIN_PASSWORD في لوحة Render عند الطلب.
services:
  - type: web
    name: sog-moderator-portal
    runtime: python
    buildCommand: pip install -r requirements-production.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: sog-moderator-db
          property: connectionString

databases:
  - name: sog-moderator-db
    databaseName: sog_moderator_portal
    user: sog_moderator_user
